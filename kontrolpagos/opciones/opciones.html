<!doctype html><html lang="es"><head><meta charset="utf-8"><title>KontrolPagos - Opciones</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;width:1400px;background:#F1F4F6;font-family:Inter,Arial,sans-serif;color:#1F2A33}
h1{margin:0 0 4px;font-size:28px}p.s{margin:0 0 24px;color:#5B6B78}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.t{background:#fff;border:1px solid #dde3e8;border-radius:14px;overflow:hidden}.n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5B6B78;padding:14px 16px 0}
h3{margin:2px 16px 8px;font-size:18px}.a{display:flex;align-items:center;gap:20px;padding:10px 16px 18px}.big{width:130px}.h{width:250px}
.b{display:flex;align-items:center;gap:20px;padding:16px}.sm{width:64px}.h2{width:250px}</style></head><body>
<h1>KontrolPagos · Opciones con moneda amarilla</h1><p class="s">Opciones 1–3 cambian el dibujo de la moneda; 4 y 5 cambian el color de la K.</p><div class="g"><div class="t"><div class="n">Opción 1</div><h3>Moneda lisa</h3>
<div class="a"><img src="opcion-1-lisa-simbolo.svg" class="big"><img src="opcion-1-lisa-horizontal.svg" class="h"></div>
<div class="b" style="background:#1F2A33"><img src="opcion-1-lisa-simbolo-invertido.svg" class="sm"><img src="opcion-1-lisa-horizontal-invertido.svg" class="h2"></div></div><div class="t"><div class="n">Opción 2</div><h3>Moneda con borde</h3>
<div class="a"><img src="opcion-2-borde-simbolo.svg" class="big"><img src="opcion-2-borde-horizontal.svg" class="h"></div>
<div class="b" style="background:#1F2A33"><img src="opcion-2-borde-simbolo-invertido.svg" class="sm"><img src="opcion-2-borde-horizontal-invertido.svg" class="h2"></div></div><div class="t"><div class="n">Opción 3</div><h3>Moneda con check</h3>
<div class="a"><img src="opcion-3-check-simbolo.svg" class="big"><img src="opcion-3-check-horizontal.svg" class="h"></div>
<div class="b" style="background:#1F2A33"><img src="opcion-3-check-simbolo-invertido.svg" class="sm"><img src="opcion-3-check-horizontal-invertido.svg" class="h2"></div></div><div class="t"><div class="n">Opción 4</div><h3>Azul marino + amarillo</h3>
<div class="a"><img src="opcion-4-marino-simbolo.svg" class="big"><img src="opcion-4-marino-horizontal.svg" class="h"></div>
<div class="b" style="background:#14263F"><img src="opcion-4-marino-simbolo-invertido.svg" class="sm"><img src="opcion-4-marino-horizontal-invertido.svg" class="h2"></div></div><div class="t"><div class="n">Opción 5</div><h3>Verde petróleo + amarillo</h3>
<div class="a"><img src="opcion-5-petroleo-simbolo.svg" class="big"><img src="opcion-5-petroleo-horizontal.svg" class="h"></div>
<div class="b" style="background:#0E3B3F"><img src="opcion-5-petroleo-simbolo-invertido.svg" class="sm"><img src="opcion-5-petroleo-horizontal-invertido.svg" class="h2"></div></div></div></body></html>
